---
include: rocsparse_common.yaml

Definitions:
  - &M_range_quick
    - { M:  50 }
    - { M: 187 }

  - &M_range_checkin
    - { M:   0 }
    - { M:  79 }
    - { M: 428 }

  - &M_range_nightly
    - { M:   9381 }
    - { M:  37017 }

Tests:
- name: spic0_solve
  category: quick
  function: spic0_solve
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M: *M_range_quick
  K: [1, 4, 35]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_random]

- name: spic0_solve
  category: pre_checkin
  function: spic0_solve
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M: *M_range_checkin
  K: [1, 12]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_random]

- name: spic0_solve
  category: nightly
  function: spic0_solve
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M: *M_range_nightly
  K: [1, 8]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_random]
