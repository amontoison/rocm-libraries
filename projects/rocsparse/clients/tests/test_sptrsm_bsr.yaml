---
include: rocsparse_common.yaml


Definitions:
  - &M_N_range_quick
    - { M:   16, N:   16 }

  - &M_N_range_checkin
    - { M:   64, N:   64 }
    - { M:  253, N:  253 }

  - &alpha_range_quick
    - { alpha:   1.0, alphai: -0.2 }

  - &alpha_range_checkin
    - { alpha:   2.0, alphai:  0.0 }

Tests:
- name: sptrsm_bsr_bad_arg
  category: pre_checkin
  function: sptrsm_bsr_bad_arg
  precision: *single_double_precisions_complex_real

- name: sptrsm_bsr
  category: quick
  function: sptrsm_bsr
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_quick
  K: [1, 7]
  alpha_alphai: *alpha_range_quick
  block_dim: [2, 5]
  direction: [rocsparse_direction_row, rocsparse_direction_column]
  transA: [rocsparse_operation_none, rocsparse_operation_transpose]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_column]
  diag: *all_rocsparse_diag_type
  uplo: *all_rocsparse_fill_mode
  baseA: *all_rocsparse_index_base
  apol: *all_rocsparse_analysis_policy
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_random]
  matrix_type: [rocsparse_matrix_type_general]

- name: sptrsm_bsr
  category: pre_checkin
  function: sptrsm_bsr
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_checkin
  K: [4]
  alpha_alphai: *alpha_range_checkin
  block_dim: [3, 8]
  direction: [rocsparse_direction_row, rocsparse_direction_column]
  transA: [rocsparse_operation_none, rocsparse_operation_transpose]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_column]
  diag: *all_rocsparse_diag_type
  uplo: *all_rocsparse_fill_mode
  baseA: [rocsparse_index_base_zero]
  apol: *all_rocsparse_analysis_policy
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_random]
  matrix_type: [rocsparse_matrix_type_general]
